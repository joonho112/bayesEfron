url: https://joonho112.github.io/bayesEfron/

template:
  bootstrap: 5
  math-rendering: mathjax
  bslib:
    primary: "#3D348B"
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "bayesEfron hex sticker"

authors:
  JoonHo Lee:
    href: https://github.com/joonho112

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

articles:
- title: Vignettes
  navbar: ~
  contents:
  - data-input
  - choosing-a-grid
  - diagnostics
  - model
  - implementation

reference:
- title: Fit the model
  desc: >
    `bayes_efron_fit()` fits the model, and `?bef_fit` describes the object
    that it returns and the methods for it.
  contents:
  - bayes_efron_fit
  - bef_fit
  - predict.bef_fit_re
- title: Prepare the data and the grid
  desc: >
    Check the estimates and their standard errors, and build the grid and
    the spline basis on which the distribution of effects is represented.
  contents:
  - as_bef_data
  - make_efron_grid
- title: Check and plot a fit
  desc: Convergence diagnostics and plots of a fitted model.
  contents:
  - diagnose
  - plot.bef_fit_re
- title: Compare models
  desc: >
    Leave-one-out cross-validation for one fit, and a comparison of several
    specifications of the grid and the spline basis.
  contents:
  - loo.bef_fit
  - compare_efron_grids
- title: Compile the model
  desc: Compile the Stan program before the first fit, or delete the compiled model.
  contents:
  - bayes_efron_compile
- title: Data
  desc: The teacher expectancy studies and the model fitted to them.
  contents:
  - raudenbush1985
  - raudenbush_fit
- title: Package
  contents:
  - bayesEfron-package
