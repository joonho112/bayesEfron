# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# One Linux job also installs CmdStan and runs the tests that fit the model;
# the other jobs check everything that does not need CmdStan.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      minimum:
        description: "Also check with the oldest versions that DESCRIPTION declares (R 4.1, CmdStan 2.34)"
        type: boolean
        default: false

name: R-CMD-check.yaml

permissions: read-all

concurrency:
  group: R-CMD-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release', stan: true}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: macos-latest,   r: 'release', snapshots: true}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      CMDSTAN_VERSION: "2.38.0"
      # The pictures of the plots are compared with the stored ones in one
      # job, on the system where they were made.
      BAYESEFRON_SNAPSHOTS: ${{ matrix.config.snapshots }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          # cmdstanr is not on CRAN, and the dependency resolver does not read
          # Additional_repositories from DESCRIPTION.
          extra-repositories: https://stan-dev.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Building CmdStan takes several minutes, so it is kept between runs.
      - name: Restore CmdStan
        if: matrix.config.stan
        id: cmdstan
        uses: actions/cache@v6
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-${{ runner.arch }}-${{ env.CMDSTAN_VERSION }}

      - name: Install CmdStan
        if: matrix.config.stan && steps.cmdstan.outputs.cache-hit != 'true'
        run: |
          cmdstanr::check_cmdstan_toolchain(fix = TRUE)
          cmdstanr::install_cmdstan(cores = 2, version = Sys.getenv("CMDSTAN_VERSION"))
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # The oldest versions of R and CmdStan that DESCRIPTION declares. The job
  # runs only when the workflow is started by hand with `minimum` checked.
  # It installs the packages that the package needs and those that its
  # tests and vignettes cannot do without; the tests of the other suggested
  # packages are skipped.
  minimum-versions:
    if: github.event_name == 'workflow_dispatch' && inputs.minimum

    runs-on: ubuntu-latest

    name: ubuntu-latest (R 4.1, CmdStan 2.34)

    timeout-minutes: 90

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      CMDSTAN_VERSION: "2.34.0"
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.1'
          use-public-rspm: true
          extra-repositories: https://stan-dev.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: >
            any::rcmdcheck, any::testthat, any::knitr, any::rmarkdown,
            any::withr, any::cli, any::loo, any::cmdstanr

      - name: Restore CmdStan
        id: cmdstan
        uses: actions/cache@v6
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-${{ runner.arch }}-${{ env.CMDSTAN_VERSION }}

      - name: Install CmdStan
        if: steps.cmdstan.outputs.cache-hit != 'true'
        run: |
          cmdstanr::check_cmdstan_toolchain(fix = TRUE)
          cmdstanr::install_cmdstan(cores = 2, version = Sys.getenv("CMDSTAN_VERSION"))
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual")'
